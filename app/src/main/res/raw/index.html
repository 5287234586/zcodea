<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZCodeA</title>
<style>
  :root {
    --bg: #0b1220; --panel: #111a2c; --line: #1f2c44; --text: #e6ecf5;
    --muted: #8fa1bd; --accent: #4f8ff7; --user: #1d4ed8; --ok: #2ea36b; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 5;
  }
  header .logo { font-weight: 700; letter-spacing: 1px; }
  header .pill { font-size: 12px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  header .pill.ready { color: var(--ok); border-color: var(--ok); }
  header .pill.busy { color: var(--warn); border-color: var(--warn); }
  header .spacer { flex: 1; }
  button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--user); border-color: var(--user); }
  button.icon { padding: 8px 10px; font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 9px 12px; border-radius: 12px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.agent.streaming::after { content: "▊"; color: var(--accent); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .msg.error { align-self: center; background: #2a1215; border: 1px solid #7f1d1d; color: #fca5a5; font-size: 13px; }
  .evt { align-self: flex-start; color: var(--muted); font-size: 11px; font-family: ui-monospace, monospace; max-width: 92%;
         border-left: 2px solid var(--line); padding-left: 8px; }
  .evt .body { margin-top: 2px; word-break: break-all; }
  .hint { color: var(--muted); font-size: 13px; text-align: center; margin-top: 8px; }
  footer { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--panel); }
  #input { flex: 1; background: #0d1526; color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 15px; outline: none; }
  #input:focus { border-color: var(--accent); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px; max-width: 92vw; padding: 18px; }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog h3 { margin: 0 0 12px; font-size: 16px; }
  dialog .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  dialog a { color: var(--accent); word-break: break-all; }
  .muted { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <span class="logo">ZCodeA</span>
  <span class="pill" id="status">…</span>
  <span class="spacer"></span>
  <button class="icon" id="newBtn" title="新建会话">＋</button>
  <button class="icon" id="stopBtn" title="停止当前任务">■</button>
  <button id="loginBtn" title="登录 GLM">登录</button>
</header>

<div id="chat">
  <div class="hint" id="hint">会话模式：消息经 ZCode Protocol 流式返回；工作目录 /root/zsha。<br>首次使用请先点右上角「登录」完成 GLM 授权。</div>
</div>

<footer>
  <input id="input" placeholder="给 ZCode 派个活…" autocomplete="off">
  <button id="sendBtn" class="primary">发送</button>
</footer>

<dialog id="loginDialog">
  <h3>登录 GLM</h3>
  <p class="muted">选择登录方式，然后把授权链接在手机浏览器里打开。</p>
  <div class="row">
    <button data-provider="zai">Z.AI 账号</button>
    <button data-provider="bigmodel">BigModel API</button>
    <button id="loginClose">关闭</button>
  </div>
  <div id="loginStatus" class="muted" style="margin-top:12px"></div>
  <p id="loginUrlBox" style="display:none"><a id="loginUrl" target="_blank" rel="noopener"></a></p>
</dialog>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusPill = document.getElementById('status');
const loginBtn = document.getElementById('loginBtn');
const newBtn = document.getElementById('newBtn');
const stopBtn = document.getElementById('stopBtn');
const loginDialog = document.getElementById('loginDialog');
const loginStatus = document.getElementById('loginStatus');
const loginUrlBox = document.getElementById('loginUrlBox');
const loginUrl = document.getElementById('loginUrl');

const qsToken = new URLSearchParams(location.search).get('token');
if (qsToken) {
  sessionStorage.setItem('zsha_token', qsToken);
  history.replaceState(null, '', location.pathname);
}
function tk() { return sessionStorage.getItem('zsha_token') || ''; }
function api(path) { return path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(tk()); }
let mode = 'session';      // session | prompt
let envReady = false;
let agentBusy = false;
let streaming = false;     // prompt 模式下
let currentBubble = null;  // agent 模式当前接收中的气泡
let eventsEs = null;

function addMsg(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text || '';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function addEvt(method, body) {
  const div = document.createElement('div');
  div.className = 'evt';
  const head = document.createElement('div');
  head.textContent = method;
  div.appendChild(head);
  if (body) {
    const b = document.createElement('div');
    b.className = 'body';
    b.textContent = body;
    div.appendChild(b);
  }
  chat.appendChild(div);
  while (chat.children.length > 400) chat.removeChild(chat.firstChild);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setHintIfEmpty(on) {
  const hint = document.getElementById('hint');
  if (hint && on && chat.children.length === 1) return;
  if (hint) hint.remove();
}

/* 从事件 params 里尽力抽取文本字段 */
function extractText(params) {
  if (!params || typeof params !== 'object') return null;
  const keys = ['content', 'text', 'delta', 'fragment', 'chunk', 'message', 'output'];
  for (const k of keys) {
    const v = params[k];
    if (typeof v === 'string' && v.length) return v;
    if (v && typeof v === 'object') {
      for (const k2 of keys) {
        if (typeof v[k2] === 'string' && v[k2].length) return v[k2];
      }
    }
  }
  // 常见嵌套：params.message.content / params.entry.text
  for (const k of Object.keys(params)) {
    const v = params[k];
    if (v && typeof v === 'object') {
      const t = extractText(v);
      if (t) return t;
    }
  }
  return null;
}

async function refreshStatus() {
  try {
    const r = await fetch(api('/app/status'));
    const s = await r.json();
    envReady = s.phase === 'ready';
    mode = s.agentMode ? 'session' : 'prompt';
    agentBusy = !!s.agentBusy;
    const phase = s.phase === 'ready' ? '就绪' : s.phase.startsWith('installing') ? '装机中' :
      s.phase.startsWith('failed') ? '装机失败' : s.phase.startsWith('abi') ? '架构不支持' : '未安装';
    const extra = mode === 'session' ? (agentBusy ? ' · 处理中' : '') : (s.chatBusy ? ' · 任务中' : '');
    statusPill.textContent = phase + extra;
    statusPill.className = 'pill ' + (s.phase === 'ready' ? 'ready' : ((s.chatBusy || agentBusy) ? 'busy' : ''));
    sendBtn.disabled = !envReady || agentBusy || streaming;
    loginBtn.disabled = !envReady;
    stopBtn.disabled = !envReady || !(agentBusy || (mode === 'session' && s.agentSessionId));
  } catch (e) {
    statusPill.textContent = '桥不可达';
  }
}

function ensureEventStream() {
  if (eventsEs || mode !== 'session' || !envReady) return;
  eventsEs = new EventSource(api('/app/agent/events'));
  eventsEs.onmessage = (e) => {
    let msg;
    try { msg = JSON.parse(e.data); } catch { return; }
    const method = msg.method || '';
    if (!method) return;
    const params = msg.params || msg.result || {};
    if (method.startsWith('startup/')) return;
    setHintIfEmpty(false);
    if (method === 'session/lifecycle/changed') {
      addEvt('会话状态', params.state || '');
      return;
    }
    // 服务端反向请求（授权/输入等）原样展示，便于人工介入
    if (msg.id !== undefined && msg.id !== null) {
      addEvt('需要响应: ' + method, JSON.stringify(params).slice(0, 300));
      return;
    }
    const text = extractText(params);
    if (text) {
      if (!currentBubble) {
        currentBubble = addMsg('agent', '');
        currentBubble.classList.add('streaming');
      }
      currentBubble.textContent += (currentBubble.textContent ? '\n' : '') + text;
      chat.scrollTop = chat.scrollHeight;
    } else {
      addEvt(method, JSON.stringify(params).slice(0, 200));
    }
  };
  eventsEs.onerror = () => {
    eventsEs.close();
    eventsEs = null;
    if (currentBubble) { currentBubble.classList.remove('streaming'); currentBubble = null; }
  };
}

async function send() {
  const text = input.value.trim();
  if (!text || sendBtn.disabled) return;
  input.value = '';
  setHintIfEmpty(false);
  addMsg('user', text);
  sendBtn.disabled = true;

  if (mode === 'session') {
    const r = await fetch(api('/app/agent/send'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      addMsg('error', j.error || ('发送失败 HTTP ' + r.status));
    } else {
      ensureEventStream();
    }
    refreshStatus();
    return;
  }

  // prompt 兼容模式（-p 单发）
  streaming = true;
  let job;
  try {
    const r = await fetch(api('/app/chat'), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text })
    });
    if (r.status === 409) { addMsg('error', '已有任务在运行，请等它完成。'); return; }
    if (!r.ok) { addMsg('error', '发送失败：HTTP ' + r.status); return; }
    job = (await r.json()).job;
  } catch (e) {
    addMsg('error', '发送失败：' + e.message);
    return;
  } finally { streaming = false; refreshStatus(); }

  const bubble = addMsg('agent', '');
  bubble.classList.add('streaming');
  let got = 0;
  const es = new EventSource(api(`/app/chat/stream?job=${job}&after=0`));
  es.addEventListener('line', e => {
    if (got > 0) bubble.textContent += '\n';
    bubble.textContent += e.data;
    got++;
    chat.scrollTop = chat.scrollHeight;
  });
  es.addEventListener('done', e => {
    es.close();
    bubble.classList.remove('streaming');
    const exit = JSON.parse(e.data).exit;
    if (got === 0) bubble.textContent = exit === 0 ? '(空回复)' : `(退出码 ${exit}，无输出)`;
    if (exit !== 0 && got > 0) bubble.textContent += `\n[退出码 ${exit}]`;
    refreshStatus();
  });
  es.onerror = () => {
    es.close();
    bubble.classList.remove('streaming');
    pollResult(job, bubble);
  };
}

async function pollResult(job, bubble) {
  try {
    const r = await fetch(api(`/app/chat/result?job=${job}&after=${bubble.dataset.after || 0}`));
    const j = await r.json();
    if (j.lines.length) {
      if (bubble.textContent) bubble.textContent += '\n';
      bubble.textContent += j.lines.join('\n');
    }
    bubble.dataset.after = j.after;
    if (j.done) { refreshStatus(); return; }
    setTimeout(() => pollResult(job, bubble), 800);
  } catch (e) { refreshStatus(); }
}

newBtn.onclick = async () => {
  await fetch(api('/app/agent/new'), { method: 'POST' });
  addEvt('会话', '已新建（下一轮生效）');
  refreshStatus();
};

stopBtn.onclick = async () => {
  await fetch(api('/app/agent/stop'), { method: 'POST' });
  if (currentBubble) { currentBubble.classList.remove('streaming'); currentBubble = null; }
  addEvt('会话', '已请求停止');
  refreshStatus();
};

loginBtn.onclick = () => { loginDialog.showModal(); };
document.getElementById('loginClose').onclick = () => loginDialog.close();
loginDialog.querySelectorAll('button[data-provider]').forEach(btn => {
  btn.onclick = async () => {
    const provider = btn.dataset.provider;
    loginStatus.textContent = '正在启动 zcode login ' + provider + ' …';
    loginUrlBox.style.display = 'none';
    try {
      const r = await fetch(api('/app/login'), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ provider })
      });
      if (!r.ok) { loginStatus.textContent = '启动失败：HTTP ' + r.status; return; }
      const { job } = await r.json();
      for (let i = 0; i < 60; i++) {
        const jr = await (await fetch(api(`/app/job?id=${job}`))).json();
        if (jr.loginUrl) {
          loginUrl.href = jr.loginUrl;
          loginUrl.textContent = jr.loginUrl;
          loginUrlBox.style.display = 'block';
          loginStatus.textContent = '点上面的链接完成浏览器授权，完成后本对话框会自动结束。';
          return;
        }
        if (jr.done) {
          loginStatus.textContent = '进程已退出（exit=' + jr.exit + '）。若未完成授权，请重试。';
          return;
        }
        await new Promise(res => setTimeout(res, 1000));
      }
      loginStatus.textContent = '等待超时，请重试。';
    } catch (e) {
      loginStatus.textContent = '出错：' + e.message;
    }
  };
});

sendBtn.onclick = send;
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
refreshStatus();
setInterval(refreshStatus, 4000);
setTimeout(ensureEventStream, 1500);
</script>
</body>
</html>
